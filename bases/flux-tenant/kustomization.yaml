# Least-privilege identity for a namespace's app Flux Kustomization (the one that applies a signed
# manifest artifact). The Kustomization sets `serviceAccountName: flux-tenant`, so kustomize-controller
# impersonates this ServiceAccount instead of using its own cluster-admin. A signed artifact can then
# only create the kinds listed in role.yaml, and only in its own namespace: cluster-scoped objects
# (ClusterRoleBinding, CRDs, Namespaces) and objects in other namespaces are rejected by the API.
# This is the Flux equivalent of an Argo CD AppProject resource whitelist.
#
# Consume as a kustomize Component; the consuming kustomization MUST set `namespace:` (resources
# here carry none, and the RoleBinding subject gets its namespace from it):
#
#   namespace: myapp-production
#   components:
#   - ../../../../bases/flux-tenant
#
# The cluster-owned resources next to the artifact (namespace, netpols, PBS jobs, Secrets) stay with
# the parent flux-system Kustomization. When an app's artifact starts shipping a new kind (e.g.
# HTTPRoute), add it to role.yaml; until then that Kustomization fails with a "forbidden" error and
# leaves the running objects untouched.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- serviceaccount.yaml
- role.yaml
- rolebinding.yaml
