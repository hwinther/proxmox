# The platform Gateway, its HTTPRoute hostname policy and the IngressRoute ban, shared by both clusters. Each cluster's
# Traefik HelmRelease enables the kubernetesGateway provider and the GatewayClass `traefik`; the `web`
# entryPoint (port 8000) must match the Gateway listener.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gateway.yaml
- httproute-hostnames-policy.yaml
- traefik-ingressroute-policy.yaml
