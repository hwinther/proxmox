# Cosign vulnerability scan attestation (Grype → SARIF predicate, cosign attest --type vuln).
#
# AUDIT for now. The reusable push (_push-image-with-signatures) attaches this attestation to
# every image it pushes (`cosign attest --type vuln`, cosign v2.4.3, legacy `sha256-….att` tag),
# on the release path (docker-/dotnet-container.yml) and the PR path (image-push.yml) alike.
# Verified on every first-party image running on 2026-10-31. Flip failureAction to Enforce (with
# mutateDigest) once the PolicyReports stay clean. Real supply-chain gating is
# clusterpolicy-github-slsa-provenance.yaml.
#
# Identity (SAN): the reusable-workflows docker-/dotnet-container or image-push workflow, pinned
# either by floating tag (@refs/tags/vN[.N[.N]]) or by 40-hex commit SHA.
# The caller repo is NOT carried in this predicate type;
# scope is enforced via `imageReferences` (which registry paths are evaluated).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: wsh-require-cosign-vuln-attestation
  annotations:
    policies.kyverno.io/title: Require Cosign vuln attestation (ghcr.io/hwinther, ghcr.io/wshno)
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: false
  # Kubernetes caps webhook timeout at 30s.
  webhookTimeoutSeconds: 30
  rules:
  - name: cosign-vuln-attestation
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - flux-system
    verifyImages:
    # Every first-party image. .NET images (dotnet-container.yml) carry the attestation too.
    - imageReferences:
      - ghcr.io/hwinther/*
      - ghcr.io/wshno/*
      # sdr-base / sdr-build debug-dev base images are built by build-sdr-images.yml (not the
      # reusable workflow) and carry no vuln attestation; skip them to keep PolicyReports clean.
      # See clusterpolicy-github-slsa-provenance.yaml for the full rationale and the Enforce block.
      skipImageReferences:
      - ghcr.io/hwinther/wsh-rtl-sdr/sdr-base*
      - ghcr.io/hwinther/wsh-rtl-sdr/sdr-build*
      # ddnsadmin (private package) is verified by its own entry below, with registry credentials.
      - ghcr.io/hwinther/ddnsadmin/*
      # Audit mode: mutateDigest requires Enforce, so it (and verifyDigest) are off here.
      # When flipping to Enforce, re-enable both.
      failureAction: Audit
      mutateDigest: false
      verifyDigest: false
      useCache: true
      attestations:
      # `type` (not the deprecated `predicateType`) — the in-toto predicate type.
      - type: https://cosign.sigstore.dev/attestation/vuln/v1
        attestors:
        - entries:
          - keyless:
              issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github.com/hwinther/reusable-workflows/\.github/workflows/(docker-container|dotnet-container|image-push)\.yml@(refs/tags/v[0-9]+(\.[0-9]+){0,2}|[a-f0-9]{40})$
              rekor:
                url: https://rekor.sigstore.dev
    # ddnsadmin's package is private, so it gets its own entry: the shared one above pulls
    # anonymously, and keeping the credential here limits a bad or missing `ghcr-pull` to this
    # image. The Secret lives in Kyverno's namespace (copied there by hand, see
    # clusters/production/apps/ddnsadmin/base/secrets-bootstrap.md); the edge cluster has none and
    # runs no ddnsadmin pod.
    - imageReferences:
      - ghcr.io/hwinther/ddnsadmin/*
      imageRegistryCredentials:
        secrets:
        - ghcr-pull
      failureAction: Audit
      mutateDigest: false
      verifyDigest: false
      useCache: true
      attestations:
      - type: https://cosign.sigstore.dev/attestation/vuln/v1
        attestors:
        - entries:
          - keyless:
              issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github.com/hwinther/reusable-workflows/\.github/workflows/(docker-container|image-push)\.yml@(refs/tags/v[0-9]+(\.[0-9]+){0,2}|[a-f0-9]{40})$
              additionalExtensions:
                githubWorkflowRepository: hwinther/ddnsadmin
              rekor:
                url: https://rekor.sigstore.dev
