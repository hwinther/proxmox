# Requires a CycloneDX SBOM attestation in the registry (cosign attest --type cyclonedx from the build).
# Predicate type must match cosign v2.x / in-toto: https://cyclonedx.org/bom (not …/schema — see cosign #2596).
#
# AUDIT for now. The reusable push (_push-image-with-signatures) attaches this attestation to
# every image it pushes (`cosign attest --type cyclonedx`, cosign v2.4.3, legacy `sha256-….att` tag),
# on the release path (docker-/dotnet-container.yml) and the PR path (image-push.yml) alike.
# Verified on every first-party image running on 2026-10-31. Flip failureAction to Enforce (with
# mutateDigest) once the PolicyReports stay clean. Real supply-chain gating is
# clusterpolicy-github-slsa-provenance.yaml.
#
# Identity (SAN): the reusable-workflows docker-/dotnet-container or image-push workflow, pinned
# either by floating tag (@refs/tags/vN[.N[.N]]) or by 40-hex commit SHA.
# The caller repo isn't in this predicate type, so scope
# is enforced via `imageReferences` (registry paths). See clusterpolicy-github-slsa-provenance.yaml for
# the SLSA policy where caller-repo IS asserted via externalParameters.workflow.repository.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: wsh-require-cyclonedx-sbom
  annotations:
    policies.kyverno.io/title: Require CycloneDX SBOM attestation (ghcr.io/hwinther, ghcr.io/wshno)
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: false
  # Kubernetes caps webhook timeout at 30s.
  webhookTimeoutSeconds: 30
  rules:
  - name: cyclonedx-attestation
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - flux-system
    verifyImages:
    # Every first-party image. .NET images (dotnet-container.yml) carry the attestation too.
    - imageReferences:
      - ghcr.io/hwinther/*
      - ghcr.io/wshno/*
      # sdr-base / sdr-build debug-dev base images are built by build-sdr-images.yml (not the
      # reusable workflow) and carry no SBOM attestation; skip them to keep PolicyReports clean.
      # See clusterpolicy-github-slsa-provenance.yaml for the full rationale and the Enforce block.
      skipImageReferences:
      - ghcr.io/hwinther/wsh-rtl-sdr/sdr-base*
      - ghcr.io/hwinther/wsh-rtl-sdr/sdr-build*
      # ddnsadmin is a private package, skipped like in clusterpolicy-github-slsa-provenance.yaml.
      - ghcr.io/hwinther/ddnsadmin/*
      # Audit mode: mutateDigest requires Enforce, so it (and verifyDigest) are off here.
      # When flipping to Enforce, re-enable both.
      failureAction: Audit
      mutateDigest: false
      verifyDigest: false
      useCache: true
      attestations:
      # `type` (not the deprecated `predicateType`) — the in-toto predicate type.
      - type: https://cyclonedx.org/bom
        attestors:
        - entries:
          - keyless:
              issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github.com/hwinther/reusable-workflows/\.github/workflows/(docker-container|dotnet-container|image-push)\.yml@(refs/tags/v[0-9]+(\.[0-9]+){0,2}|[a-f0-9]{40})$
              rekor:
                url: https://rekor.sigstore.dev
        conditions:
        - all:
          - key: "{{ bomFormat }}"
            operator: Equals
            value: CycloneDX
