# CycloneDX SBOM + vuln attestations for images built in the private hwinther/private-apps repo. AUDIT.
# Same shape as imagevalidatingpolicy-ddnsadmin-attestations.yaml; the generic SBOM/vuln policies
# exclude this prefix because the identity here also pins the caller repo (githubWorkflowRepository).
# No registry credentials: the packages are public.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: wsh-require-private-apps-attestations
  annotations:
    policies.kyverno.io/title: Require CycloneDX SBOM + vuln attestations (ghcr.io/hwinther/private-apps)
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: false
  # Kubernetes caps webhook timeout at 30s.
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kyverno
        - flux-system
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  matchConditions:
  - name: create-or-image-changed
    expression: >-
      request.operation != 'UPDATE' ||
      object.spec.containers.map(c, c.image) != oldObject.spec.containers.map(c, c.image) ||
      object.spec.?initContainers.orValue([]).map(c, c.image) != oldObject.spec.?initContainers.orValue([]).map(c, c.image)
  matchImageReferences:
  - glob: ghcr.io/hwinther/private-apps/*
  # Audit only: digest pinning is done by the enforcing SLSA / ddnsadmin-signature policies.
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors:
  - name: privateAppsBuild
    cosign:
      keyless:
        identities:
        - issuer: https://token.actions.githubusercontent.com
          subjectRegExp: ^https://github.com/hwinther/reusable-workflows/\.github/workflows/(docker-container|image-push)\.yml@(refs/tags/v[0-9]+(\.[0-9]+){0,2}|[a-f0-9]{40})$
        additionalExtensions:
          githubWorkflowRepository: hwinther/private-apps
      ctlog:
        url: https://rekor.sigstore.dev
  attestations:
  - name: cyclonedx
    intoto:
      type: https://cyclonedx.org/bom
  - name: vuln
    intoto:
      type: https://cosign.sigstore.dev/attestation/vuln/v1
  variables:
  - name: allImages
    expression: >-
      images.?containers.orValue([]) + images.?initContainers.orValue([]) +
      images.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.allImages.all(img, verifyAttestationSignatures(img, attestations.cyclonedx, [attestors.privateAppsBuild]) > 0)
    message: >-
      Image has no CycloneDX SBOM attestation (Sigstore bundle) signed by the reusable-workflows build/push workflow.
  - expression: >-
      variables.allImages.all(img, extractPayload(img, attestations.cyclonedx).predicate.bomFormat == 'CycloneDX')
    message: >-
      The CycloneDX attestation's predicate is not a CycloneDX BOM.
  - expression: >-
      variables.allImages.all(img, verifyAttestationSignatures(img, attestations.vuln, [attestors.privateAppsBuild]) > 0)
    message: >-
      Image has no cosign vuln attestation (Sigstore bundle) signed by the reusable-workflows build/push workflow.
