# Every Flux Kustomization outside flux-system applies an app's manifest artifact and must impersonate
# a namespace-local ServiceAccount (bases/flux-tenant), so a signed artifact can't create cluster-scoped
# objects or write into other namespaces with kustomize-controller's cluster-admin. Kustomizations in
# flux-system are the platform layer and keep the controller identity.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: wsh-flux-tenant-service-account
  annotations:
    policies.kyverno.io/title: Flux app Kustomizations impersonate a tenant ServiceAccount
    policies.kyverno.io/category: Flux
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Kustomizations outside flux-system must set spec.serviceAccountName (the flux-tenant component),
      so kustomize-controller applies them with namespace-scoped permissions instead of cluster-admin.
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
    resourceRules:
    - apiGroups: [kustomize.toolkit.fluxcd.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [kustomizations]
  validations:
  - expression: object.spec.?serviceAccountName.orValue('') != ''
    message: >-
      Set spec.serviceAccountName: flux-tenant and add the bases/flux-tenant component to the namespace's
      kustomization.
