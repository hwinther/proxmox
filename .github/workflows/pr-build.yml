name: PR build

on:
    pull_request:
        branches:
            - main
    # Required for the merge queue: the queue builds a temporary
    # gh-readonly-queue/main/... branch and fires merge_group instead of
    # pull_request. Without this the required `pr-build / pr-build` check never
    # reports, and the queue evicts the PR when it times out.
    merge_group:
        types: [checks_requested]
    # On main for the quality artifact (wshno/devops repository report). Path-filtered: most
    # commits on main are manifests and preview upserts, which the Python suite doesn't cover.
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "scripts/**"
            - "pyproject.toml"
            - ".github/workflows/pr-build.yml"
    # Weekly too, so the quality-summary artifact (90 days) never expires between pushes.
    schedule:
        - cron: "23 4 * * 1"
    workflow_dispatch:

concurrency:
    group: pr-build-caller-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
    pr-build:
        permissions:
            contents: read
            pull-requests: write
            checks: write
            packages: read
        uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@3a42f0c604e95cd46a9b9e01519aea3f425c5589 # v2.33.0
        with:
            python_enabled: true
            python_version: "3.13"
            python_changes_regex: '^(src/|scripts/|pyproject\.toml|\.github/workflows/pr-build\.yml)'

    # pytest results, coverage and warnings as ghcr.io/hwinther/proxmox/quality:main, and as the
    # workflow artifact quality-summary that the wshno/devops report reads. Also runs when the
    # tests failed, so the failures are reported.
    quality:
        needs: [pr-build]
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        permissions:
            contents: read
            packages: write
            id-token: write
        uses: hwinther/reusable-workflows/.github/workflows/quality-artifact.yml@3a42f0c604e95cd46a9b9e01519aea3f425c5589 # v2.33.0
        with:
            tags: |
                main
