name: PR build

on:
    pull_request:
        branches:
            - main
    # Required for the merge queue: the queue builds a temporary
    # gh-readonly-queue/main/... branch and fires merge_group instead of
    # pull_request. Without this the required `pr-build / pr-build` check never
    # reports, and the queue evicts the PR when it times out.
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

concurrency:
    group: pr-build-caller-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: write
    checks: write
    packages: read

jobs:
    pr-build:
        uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
        with:
            python_enabled: true
            python_version: "3.13"
            python_changes_regex: '^(src/|scripts/|pyproject\.toml|\.github/workflows/pr-build\.yml)'
