name: Manifest diff

# Renders every Flux Kustomization path this repo syncs (the flux-system GitRepository's, listed in
# clusters/*/flux-system/gotk-sync.yaml) for the PR head and its base, and posts a review report to
# the job summary and a sticky PR comment: a Mermaid map of the changed resources and their direct
# neighbours, plus a dyff per changed resource. Same report as the app repos' deploy/ diffs.
#
# Each changed HelmRelease's chart is templated at both sides too (helm: "true"), so a chart bump or
# values change shows the resources it really changes; CRDs, lookup() results and values from
# Secrets that aren't in the repo are left out. OCI-sourced app manifests live in their artifact
# (the app repo's PR shows them); here only the OCIRepository ref change shows.

on:
    pull_request:
        paths:
            - "clusters/**"
            - "bases/**"
            - ".github/workflows/manifest-diff.yml"

permissions:
    contents: read

concurrency:
    group: "${{ github.workflow }} @ ${{ github.head_ref }}"
    cancel-in-progress: true

jobs:
    diff:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: List the Flux paths
              id: paths
              run: |
                  {
                      echo "renders<<EOF"
                      yq -N 'select(.kind == "Kustomization" and .spec.sourceRef.kind == "GitRepository" and .spec.sourceRef.name == "flux-system") | .spec.path' clusters/*/flux-system/gotk-sync.yaml \
                          | sed 's|^\./||' | awk '{ print $0 ".yaml=" $0 }'
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Render and report
              uses: hwinther/reusable-workflows/.github/actions/manifests@e80ab952c6982cd557a8722fa124bf971aad6134 # v2.3.0
              with:
                  mode: diff
                  renders: ${{ steps.paths.outputs.renders }}
                  map: changed
                  contract: "false"
                  # verify-dependabot-clusters and Flux's own server dry-run cover validity.
                  validate: "false"
                  helm: "true"
                  # The clusters' Kubernetes version, for charts that gate on .Capabilities.
                  helm_kube_version: "1.35.8"
                  comment_key: cluster-manifest-diff
                  note: "Rendered with kustomize, charts with helm template (no CRDs, Secret values redacted); OCI artifacts are not expanded."
