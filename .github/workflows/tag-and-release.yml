name: "Opprett tag og release"

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Navn på tag (f.eks. v1.2.3)"
                required: false
                default: "auto"
            release_notes:
                description: "Utgivelsesnotater for denne taggen"
                required: false
            create_release:
                description: "Opprett en GitHub Release for denne taggen"
                required: false
                default: true
                type: boolean

# Repo-wide v* tags only. The container images release on their own tags (esp-poller-v*,
# pbs-backup-client-v*; see build-esp-poller.yml and build-proxmox-pbs-backup-client.yml), so a v* release
# no longer builds them.
permissions:
    contents: write

jobs:
    tag:
        # No `secrets:` block: the reusable tag-and-release.yml uses only GITHUB_TOKEN
        # (auto-available to called workflows). Avoids the zizmor "secrets unconditionally
        # inherited" finding.
        uses: hwinther/reusable-workflows/.github/workflows/tag-and-release.yml@1fa5882e8aa1048af78492baf016f5a7b310be11 # v2.29.0
        with:
            tag_name: ${{ inputs.tag_name }}
            release_notes: ${{ inputs.release_notes }}
            create_release: ${{ inputs.create_release }}
