# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "npm"
  directory: "/"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"

- package-ecosystem: "pip"
  directory: "/"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"

# esp-poller container image — pins its own runtime deps in requirements.txt
# (kept separate from the root pyproject so the image rebuild surface is small).
- package-ecosystem: "pip"
  directory: "/images/esp-poller"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"

# esp-poller image: the Chainguard python builder (latest-dev) and runtime (latest) digests. The PR
# is built and scanned by build-esp-poller.yml; the next esp-poller-v* tag publishes it.
- package-ecosystem: "docker"
  directory: "/images/esp-poller"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  # Both digests in one PR: the builder's Python has to match the runtime's, or the wheels
  # pip resolves (cp3XX-specific) won't load.
  groups:
    chainguard-python:
      patterns:
      - "*"

# proxmox-pbs-backup-client image: the debian builder and distroless runtime digests. The PR is built
# and scanned by build-proxmox-pbs-backup-client.yml; the next pbs-backup-client-v* tag publishes it.
- package-ecosystem: "docker"
  directory: "/images/proxmox-pbs-backup-client"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7

# edge-sdr cluster (k0s / SDR edge).
- package-ecosystem: "docker"
  directories:
  - "/clusters/edge-sdr"
  - "/clusters/edge-sdr/apps"
  - "/clusters/edge-sdr/apps/adsb-edge-sdr"
  - "/clusters/edge-sdr/apps/ais-catcher-edge-sdr"
  - "/clusters/edge-sdr/apps/fluent-bit-edge-sdr"
  - "/clusters/edge-sdr/apps/gateway-api"
  - "/clusters/edge-sdr/apps/node-exporter-edge-sdr"
  - "/clusters/edge-sdr/apps/prometheus-agent-edge-sdr"
  - "/clusters/edge-sdr/apps/sdr-device-plugin-edge-sdr"
  - "/clusters/edge-sdr/apps/sdr-debug-edge-sdr"
  - "/clusters/edge-sdr/apps/traefik"
  - "/clusters/edge-sdr/apps/ceph-csi"
  - "/clusters/edge-sdr/apps/homepage"
  - "/clusters/edge-sdr/apps/headlamp-edge-sdr"
  - "/clusters/edge-sdr/apps/kyverno"
  - "/clusters/edge-sdr/apps/kyverno-policies"
  - "/clusters/edge-sdr/apps/kubescape-edge-sdr"
  - "/clusters/edge-sdr/apps/policy-reporter-edge-sdr"
  - "/clusters/edge-sdr/apps/oidc-k8s-admins-rbac"
  - "/clusters/edge-sdr/flux-system"
  schedule:
    interval: "daily"
  groups:
    clutterstock:
      patterns:
      - "hwinther/clutterstock/*"
    test:
      patterns:
      - "hwinther/test/*"
    fluxcd:
      patterns:
      - "fluxcd/*"
    # The wsh-rtl-sdr feeders are released together (one v* tag), so their bumps come as one PR.
    wsh-rtl-sdr:
      patterns:
      - "hwinther/wsh-rtl-sdr/*"
  open-pull-requests-limit: 20

