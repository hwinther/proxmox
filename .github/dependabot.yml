      - "hwinther/skylens/*"
    fluxcd:
      patterns:
      - "fluxcd/*"
    # Our own infrastructure images (pbs backup-client, esp-poller) and the pgdump postgres image
    # appear in many app directories; one release is one PR across all of them, not one per app.
    proxmox-images:
      patterns:
      - "hwinther/proxmox/*"
    postgres:
      patterns:
      - "postgres"
  open-pull-requests-limit: 20

# Production cluster — test-tier apps (separate PRs from prod workloads above).
- package-ecosystem: "docker"
  directories:
  - "/clusters/production/apps/clutterstock-test"
  - "/clusters/production/apps/test-test"
  - "/clusters/production/apps/shared/test"
  schedule:
    interval: "daily"
  groups:
    clutterstock:
      patterns:
      - "hwinther/clutterstock/*"
    test:
      patterns:
      - "hwinther/test/*"
    # Our own infrastructure images (pbs backup-client, esp-poller) and the pgdump postgres image
    # appear in many app directories; one release is one PR across all of them, not one per app.
    proxmox-images:
      patterns:
      - "hwinther/proxmox/*"
    postgres:
      patterns:
      - "postgres"
  open-pull-requests-limit: 20
