# prometheus-node-exporter mounts host rootfs, proc, and sys for hardware metrics.
# INERT while Kyverno runs with --enablePolicyException=false (both clusters): the CEL engine
# ignores PolicyExceptions just like the legacy one did. Kept as the documented, ready-to-use carve-out
# for the Audit ValidatingPolicy below; it takes effect if exceptions are ever enabled.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter-hostpath
  namespace: node-exporter-edge-sdr
spec:
  policyRefs:
  - name: wsh-disallow-host-path
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'node-exporter-edge-sdr' &&
      object.metadata.?labels['app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter'
