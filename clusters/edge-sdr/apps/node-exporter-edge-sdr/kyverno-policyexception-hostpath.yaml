# prometheus-node-exporter mounts host rootfs, proc, and sys for hardware metrics.
# Active: Kyverno 1.19 applies policies.kyverno.io PolicyExceptions to the CEL ValidatingPolicy below
# even with --enablePolicyException=false (that flag only governs the legacy kyverno.io kind); the
# PolicyReports show "rule is skipped due to policy exception".
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter-hostpath
  namespace: node-exporter-edge-sdr
spec:
  policyRefs:
  - name: wsh-disallow-host-path
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'node-exporter-edge-sdr' &&
      object.metadata.?labels['app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter'
