apiVersion: v1
kind: Namespace
metadata:
  name: headlamp-edge-sdr
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: headlamp.mgmt-edge-sdr.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml).
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: edge-sdr
