apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-ui
  namespace: policy-reporter-edge-sdr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Management"
    gethomepage.dev/name: "Policy Reporter"
    gethomepage.dev/icon: "mdi-clipboard-text-search"
    gethomepage.dev/description: "Kyverno policy reports dashboard"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - policy-reporter.mgmt-edge-sdr.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: policy-reporter-ui
      port: 8080
