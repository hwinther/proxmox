apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: platform-edge-sdr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Management"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/icon: "homepage"
    gethomepage.dev/description: "Service dashboard"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - mgmt-edge-sdr.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: homepage
      port: 3000
