# ADSB stack (readsb, tar1090, feeders) on edge Pi workers. Shared JSON
# under hostPath /run/k8s-edge-sdr/readsb (readsb, tar1090 and adsb-mqtt must land on the same node).
apiVersion: v1
kind: Namespace
metadata:
  name: adsb-edge-sdr
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: tar1090.edge-sdr.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml).
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: adsb-edge-sdr
