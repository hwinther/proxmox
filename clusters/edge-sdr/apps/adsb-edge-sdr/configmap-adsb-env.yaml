# Defaults for compose-derived settings. **LAT**, **LON**, **ALT** (and other keys) can be
# overridden by the same names in **adsb-secret** (envFrom: ConfigMap then Secret — see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adsb-env
  namespace: adsb-edge-sdr
data:
  LAT: "59.0"
  LON: "10.0"
  # readsb's position (rounded); the real 2-decimal values come from adsb-secret, see README.md.
  READSB_LAT: "59.0"
  READSB_LON: "10.0"
  ALT: "100"
  DEVICE_INDEX: "00001090"
  DEBUG: "false"
