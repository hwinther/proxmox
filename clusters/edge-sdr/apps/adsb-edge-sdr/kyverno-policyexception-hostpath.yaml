# Namespace uses a hostPath for the shared JSON dir (readsb writes it; tar1090 and adsb-mqtt read it).
# Active: Kyverno 1.19 applies policies.kyverno.io PolicyExceptions to the CEL ValidatingPolicy below
# even with --enablePolicyException=false (that flag only governs the legacy kyverno.io kind); the
# PolicyReports show "rule is skipped due to policy exception".
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: adsb-edge-sdr-hostpath
  namespace: adsb-edge-sdr
spec:
  policyRefs:
  - name: wsh-disallow-host-path
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'adsb-edge-sdr'
