# Namespace uses a hostPath for the shared JSON dir (readsb writes it; tar1090 and adsb-mqtt read it).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: adsb-edge-sdr-hostpath
  namespace: adsb-edge-sdr
spec:
  exceptions:
  - policyName: wsh-disallow-host-path
    ruleNames:
    - host-path
  match:
    any:
    - resources:
        kinds:
        - Pod
        namespaces:
        - adsb-edge-sdr
