# Fluent Bit reads /var/log/pods and (via chart defaults) may reference host log paths.
# INERT while Kyverno runs with --enablePolicyException=false (both clusters): the CEL engine
# ignores PolicyExceptions just like the legacy one did. Kept as the documented, ready-to-use carve-out
# for the Audit ValidatingPolicy below; it takes effect if exceptions are ever enabled.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: fluent-bit-hostpath-logs
  namespace: fluent-bit-edge-sdr
spec:
  policyRefs:
  - name: wsh-disallow-host-path
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'fluent-bit-edge-sdr' &&
      object.metadata.?labels['app.kubernetes.io/name'].orValue('') == 'fluent-bit'
