# The device plugin lists /dev and /sys on the host and registers a socket in the kubelet's
# device-plugins directory (root-owned), so it needs hostPath and uid 0. All capabilities are dropped.
# INERT while Kyverno runs with --enablePolicyException=false (both clusters): the CEL engine
# ignores PolicyExceptions just like the legacy one did. Kept as the documented, ready-to-use carve-out
# for the Audit ValidatingPolicy below; it takes effect if exceptions are ever enabled.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: generic-device-plugin
  namespace: sdr-device-plugin-edge-sdr
spec:
  policyRefs:
  - name: wsh-disallow-host-path
    kind: ValidatingPolicy
  - name: wsh-require-run-as-non-root
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'sdr-device-plugin-edge-sdr' &&
      object.metadata.?labels['app.kubernetes.io/name'].orValue('') == 'generic-device-plugin'
