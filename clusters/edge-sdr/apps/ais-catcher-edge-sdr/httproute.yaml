apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ais-catcher
  namespace: ais-catcher-edge-sdr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/name: "AIS-Catcher (edge / Pi)"
    gethomepage.dev/icon: "mdi-ship-wheel"
    gethomepage.dev/description: "AIS receiver on SDR edge nodes (USB RTL-AIS), matches compose radio-pi02/ais"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - ais.edge-sdr.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ais-catcher
      port: 8080
