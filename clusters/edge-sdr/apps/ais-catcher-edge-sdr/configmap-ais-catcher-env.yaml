# Station and dongle settings, used as $(VAR) in the Deployment's args. **ais-catcher-secret**
# overrides LAT/LON with the exact position; the feeds (sharing key, UDP hubs, MQTT) are its
# feeds.json, not env. See README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ais-catcher-env
  namespace: ais-catcher-edge-sdr
data:
  DEVICE_INDEX: "00000162"
  BIASTEE: "on"
  LAT: "59.000000"
  LON: "10.000000"
  STATION_NAME: "Gjonnes"
  STATION_URL: "https://ais.edge-sdr.wsh.no"
