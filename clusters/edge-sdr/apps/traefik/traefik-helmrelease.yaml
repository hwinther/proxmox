apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: edge-sdr
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  # Detect manual changes to Helm-managed resources (warn-only; flip to enabled per-release once proven quiet).
  driftDetection:
    mode: warn
  interval: 30m
  ## CRDs applied from traefik-crds.yaml (same chart version); avoid Helm/Flux ordering issues.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "42.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    deployment:
      kind: DaemonSet
      # ForwardAuth to production's Authelia stays on the LAN: auth.wsh.no is pinned here to the
      # production nodes, where production Traefik listens on :8000 (hostNetwork, plain HTTP, as the
      # OPNsense nginx reaches it). Public DNS points auth.wsh.no at the abyss VPS, so without this
      # every Headlamp API call went out and back through abyss: edge logins broke whenever abyss was
      # unreachable, and the volume got the home IP banned by CrowdSec there (2026-11-05). Go tries
      # the addresses in turn, so one node down is fine. Only this pod's /etc/hosts changes.
      # Keep in sync with the production node IPs.
      hostAliases:
      - ip: 10.20.13.11
        hostnames: [auth.wsh.no]
      - ip: 10.20.13.12
        hostnames: [auth.wsh.no]
      - ip: 10.20.13.13
        hostnames: [auth.wsh.no]
      - ip: 10.20.13.14
        hostnames: [auth.wsh.no]
      - ip: 10.20.13.15
        hostnames: [auth.wsh.no]
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    hostNetwork: true
    # Gateway API (HTTPRoute), as in production. CRDs: ../gateway-api (standard channel only, so
    # experimentalChannel stays off). The Gateway comes from bases/traefik-gateway. statusAddress: the
    # Service is ClusterIP (hostNetwork DaemonSet), so there's no LB address for Gateway status.
    # Gateway API is the only way in, as in production: the Ingress provider would serve any Ingress past
    # the HTTPRoute hostname grants, so it's off along with the chart's (default) IngressClass.
    # IngressRoutes are refused by bases/traefik-gateway/traefik-ingressroute-policy.yaml.
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        statusAddress:
          service:
            enabled: false
    gateway:
      enabled: false
    ingressClass:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    # Sized from observed usage (1m CPU, 52Mi); memory-limited for the 2vCPU/low-RAM Pis,
    # no CPU limit to avoid throttling the ingress data path.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi
    # Chart v40 moved Service.type under service.spec (PR #1686, "align syntax with
    # upstream"). hostNetwork DaemonSet ingress comes in via the node, so keep ClusterIP
    # rather than the new LoadBalancer default.
    service:
      spec:
        type: ClusterIP
    ports:
      traefik:
        port: 9000
        expose:
          default: false
      web:
        port: 8000
        expose:
          default: true
        # TLS ends at the nginx front-ends (mgmt nginx 10.20.1.63, OPNsense), which send
        # X-Forwarded-Proto: https. Trust them, as production Traefik does, so the scheme survives:
        # Authelia's ForwardAuth refuses an http target URL (400 "insecure scheme"). It used to work
        # only because the check went out through abyss, whose nginx rewrote the header.
        forwardedHeaders:
          trustedIPs:
          - 10.20.0.0/16
      websecure:
        port: 8444
        expose:
          default: true
