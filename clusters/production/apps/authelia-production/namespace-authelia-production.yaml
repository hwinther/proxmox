apiVersion: v1
kind: Namespace
metadata:
  name: authelia-production
  annotations:
    # Hostnames HTTPRoutes here may claim (../traefik/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: auth.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (../traefik/gateway.yaml). The forward-auth
    # Middleware generation skips this namespace: it holds the source.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: production
    pbs.wsh.no/encryption-keyfile: "true"
