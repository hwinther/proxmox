apiVersion: v1
kind: Namespace
metadata:
  name: clutterstock-test
  # Holds the PBS backup state and Kyverno-cloned Secrets. The retired clutterstock-test-migrate
  # Kustomization also listed this Namespace; prune: disabled keeps any Flux garbage collection
  # (that one's, or a future move) from deleting it.
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: clutterstock.test.wsh.no
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: clutterstock-test
    pbs.wsh.no/encryption-keyfile: "true"
