# Daily backup of clutterstock-test postgres database to Proxmox Backup Server.
#
# Flow (per scheduled run):
#   1. initContainer pgdump runs pg_dump -Fc against the CNPG cluster (creds from cluttertestdb-app/uri)
#      and writes /dump/clutterstock.pgdump in an emptyDir.
#   2. Main container archives /dump as a PBS .pxar snapshot.
#
# Prerequisites:
#   1. Create Secret `clutterstock-test-pbs-backup` (see pbs-backup-secrets.md).
#   2. CNPG cluster `cluttertestdb` Ready and the operator-provided `cluttertestdb-app` Secret present.
#
# Trigger an immediate run (outside the schedule):
#   kubectl -n clutterstock-test create job --from=cronjob/clutterstock-test-pbs-backup clutterstock-test-pbs-backup-manual-$(date +%s)
#
# Image tag (PBS client): GitVersion MajorMinorPatch from .github/workflows/build-proxmox-pbs-backup-client.yml.
# PBS client image is linux/amd64 only; postgres:18-alpine is multi-arch but pinned to amd64 here for symmetry.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clutterstock-test-pbs-backup
  namespace: clutterstock-test
spec:
  # 02:30 Europe/Oslo daily — runs first in the staggered backup window so a failing path is visible early.
  schedule: "30 2 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Auto-delete the finished Job + its pod ~2 days after completion (TTL-after-finished
      # controller). Also reaps manual `--from=cronjob` runs, which the *JobsHistoryLimit don't.
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clutterstock-pbs-backup
            app.kubernetes.io/component: clutterstock-pbs-backup
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          hostname: clutterstock-test-postgres
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            fsGroup: 1654
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
          - name: pgdump
            image: postgres:18-alpine@sha256:eaef288f54a90a909e49f0121d5d047a5e974e922699de4249625cf7cde34f36
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - 'pg_dump -Fc -f /dump/clutterstock.pgdump "$PGURI"'
            env:
            - name: PGURI
              valueFrom:
                secretKeyRef:
                  name: cluttertestdb-app
                  key: uri
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: dump
              mountPath: /dump
          containers:
          - name: backup
            image: ghcr.io/hwinther/proxmox/proxmox/pbs/backup-client:0.7.3
            imagePullPolicy: IfNotPresent
            # pbs-job adds --ns (PBS_NAMESPACE) and --keyfile (/etc/pbs/keyfile) when set, then runs
            # proxmox-backup-client; the image has no shell.
            command:
            - /usr/bin/pbs-job
            args:
            - backup
            - db.pxar:/dump
            envFrom:
            - secretRef:
                name: clutterstock-test-pbs-backup
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: dump
              mountPath: /dump
            - name: pbs-keyfile
              mountPath: /etc/pbs
              readOnly: true
          volumes:
          - name: dump
            emptyDir: {}
          # Optional: client-side encryption keyfile (PBS AES-256-GCM). The cluster-wide source
          # `pbs-encryption-keyfile` lives in platform-production; Kyverno clones it here. When the
          # source Secret is absent, the clone no-ops, the mount stays empty, and --keyfile is not
          # added — backup runs unencrypted.
          - name: pbs-keyfile
            secret:
              secretName: pbs-encryption-keyfile
              optional: true
              items:
              - key: keyfile
                path: keyfile
                mode: 0400
