apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant-production
  annotations:
    gethomepage.dev/href: "https://home-assistant.wsh.no/"
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "Home Assistant"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - home-assistant.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: home-assistant
      port: 8123
