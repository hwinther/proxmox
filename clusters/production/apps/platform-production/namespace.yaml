# Shared platform resources for the production cluster (ingress, observability, etc.).
# Per-app namespaces use appname-environment (e.g. clutterstock-api-production).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-production
  annotations:
    # Hostnames HTTPRoutes here may claim (traefik/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: mgmt.wsh.no,hubble.mgmt.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (traefik/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
