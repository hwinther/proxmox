# Management UI (port 15672) — same hostname pattern as other *.mgmt.wsh.no UIs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq-management
  namespace: rabbitmq-production
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "RabbitMQ"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - rabbitmq.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rabbitmq
      port: 15672
