# Namespace **test-test** = app **test** (repo sample) + environment **test** (DNS *.test.wsh.no). Cluster: production k0s.
apiVersion: v1
kind: Namespace
metadata:
  name: test-test
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml); the artifact's
    # HTTPRoute/test uses APP_HOST.
    gateway.wsh.no/hostnames: test.test.wsh.no
  labels:
    app.kubernetes.io/part-of: test-test
    # trust-manager Bundle (../cert-manager/bundle-wsh-internal-ca.yaml) renders ConfigMap
    # wsh-internal-ca in every namespace with this label — consumed by the API in the test artifact (see test-manifests.yaml).
    wsh.no/trust-bundle: "true"
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml).
    gateway.wsh.no/traefik: "true"
