# Gateway API pilot, side by side with the artifact's Ingress (test.test.wsh.no is untouched). Two
# throwaway hosts on the platform Gateway (../traefik/gateway.yaml):
# - gateway-pilot.test.wsh.no: the same paths as the Ingress, plain HTTPRoute.
# - gateway-pilot-auth.test.wsh.no: the frontend behind Authelia via an ExtensionRef filter.
#
# An HTTPRoute ExtensionRef is a local reference, so the Middleware must be in the route's namespace.
# Kyverno generates authelia-forwardauth in every namespace labeled gateway.wsh.no/traefik=true
# (../platform-production/kyverno-generatingpolicy-generate-forwardauth-middleware.yaml).
#
# Remove this file when the app's own artifact ships HTTPRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-pilot
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - gateway-pilot.test.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /swagger
    - path:
        type: PathPrefix
        value: /hubs
    backendRefs:
    - name: test-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: test-frontend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-pilot-auth
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - gateway-pilot-auth.test.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: test-frontend
      port: 8080
