apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: node-red
  namespace: node-red-production
  annotations:
    gethomepage.dev/href: "https://node-red.wsh.no/"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/name: "Node-RED"
    gethomepage.dev/siteMonitor: "https://node-red.wsh.no"
    gethomepage.dev/icon: "node-red"
    gethomepage.dev/description: "Flow-based automation editor"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - node-red.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: node-red
      port: 1880
