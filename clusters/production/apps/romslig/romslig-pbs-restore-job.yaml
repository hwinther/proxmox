# Restore romslig-production postgres database from a PBS snapshot into the CNPG cluster.
# Same amd64-only PBS client image and tag as the backup Job.
#
# Not in kustomization.yaml: apply manually when needed, e.g.
#   kubectl apply -f clusters/production/apps/romslig/romslig-pbs-restore-job.yaml
#
# Flow:
#   1. initContainer pbs-restore pulls db.pxar from PBS_RESTORE_SNAPSHOT into an emptyDir.
#   2. Main container runs pg_restore against the CNPG cluster (libpq env vars).
#
# Prerequisites:
#   1. Secret `romslig-pbs-backup`: PBS_REPOSITORY, PBS_PASSWORD, PBS_RESTORE_SNAPSHOT
#      (and PBS_NAMESPACE / PBS_ENCRYPTION_PASSWORD if used). See romslig-secrets.md.
#   2. CNPG cluster `postgres-prod` Ready, `romslig` role + DB present, `romslig-pg-secret`
#      cloned into romslig-production.
#   3. Stop the API before restoring (writes during restore corrupt the dump):
#        kubectl -n romslig-production scale deployment romslig-api --replicas=0
#
# WARNING: `pg_restore --clean --if-exists` drops and recreates objects owned by the `romslig`
#          user inside the target database. Verify on a clone first.
#
# Re-runs: `spec.template` is immutable — delete the Job or bump `metadata.name` when the pod spec changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: romslig-pbs-restore-v001
  namespace: romslig-production
spec:
  backoffLimit: 1
  # Job object (and finished Pods) are deleted this many seconds after Complete/Failed.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romslig-pbs-restore
        app.kubernetes.io/component: romslig-pbs-backup
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      hostname: romslig-postgres
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: pbs-restore
        image: ghcr.io/hwinther/proxmox/proxmox/pbs/backup-client:0.7.3
        imagePullPolicy: IfNotPresent
        # pbs-job adds --ns (PBS_NAMESPACE) and --keyfile (/etc/pbs/keyfile) when set, then runs
        # proxmox-backup-client; the image has no shell.
        command:
        - /usr/bin/pbs-job
        args:
        - restore
        - $(PBS_RESTORE_SNAPSHOT)
        - db.pxar
        - /dump/
        envFrom:
        - secretRef:
            name: romslig-pbs-backup
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: dump
          mountPath: /dump
        - name: pbs-keyfile
          mountPath: /etc/pbs
          readOnly: true
      containers:
      - name: pgrestore
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'pg_restore --clean --if-exists --no-owner --no-acl -d "$PGDATABASE" /dump/romslig.pgdump'
        env:
        - name: PGHOST
          value: postgres-prod-rw.postgres-production.svc.cluster.local
        - name: PGUSER
          value: romslig
        - name: PGDATABASE
          value: romslig
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: romslig-pg-secret
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: dump
          mountPath: /dump
      volumes:
      - name: dump
        emptyDir: {}
      - name: pbs-keyfile
        secret:
          secretName: pbs-encryption-keyfile
          optional: true
          items:
          - key: keyfile
            path: keyfile
            mode: 0400
