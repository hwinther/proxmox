apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-nodes-to-romslig-http
  namespace: romslig-production
spec:
  endpointSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - romslig-api
      - romslig-web
  ingress:
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
