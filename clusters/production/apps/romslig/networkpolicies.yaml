# Pod labels assume the artifact's Deployments use `app: romslig-api` / `app: romslig-web` (same
# convention as clutterstock's artifact). DNS egress also comes from the netpol-baseline component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: romslig-api
  namespace: romslig-production
spec:
  podSelector:
    matchLabels:
      app: romslig-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP
  # In-cluster fetch: web pod -> API Service (not via Traefik), if the web server calls the API.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: romslig-production
      podSelector:
        matchLabels:
          app: romslig-web
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-production
    ports:
    - port: 4317
      protocol: TCP
    - port: 4318
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: postgres-production
    ports:
    - port: 5432
      protocol: TCP
  # HTTPS to the internet: AI_MODE=server proxies to api.anthropic.com. Cilium never matches
  # in-cluster pods via this world rule, so in-cluster targets need their own rules above.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - port: 443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: romslig-web
  namespace: romslig-production
spec:
  podSelector:
    matchLabels:
      app: romslig-web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: romslig-production
      podSelector:
        matchLabels:
          app: romslig-api
    ports:
    - port: 8080
      protocol: TCP
  # OTLP to the collector (traces/logs, CSP violation reports among them).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-production
    ports:
    - port: 4317
      protocol: TCP
    - port: 4318
      protocol: TCP
---
# PBS backup/restore Jobs: DNS + Postgres (pg_dump/pg_restore) + HTTPS + PBS API port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: romslig-pbs-backup
  namespace: romslig-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: romslig-pbs-backup
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: postgres-production
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - port: 443
      protocol: TCP
    - port: 8007
      protocol: TCP
