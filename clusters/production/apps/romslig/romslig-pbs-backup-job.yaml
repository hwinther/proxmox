# Daily backup of romslig-production postgres database to Proxmox Backup Server.
#
# Flow (per scheduled run):
#   1. initContainer pgdump runs pg_dump -Fc using libpq env vars (PGHOST/PGUSER/PGPASSWORD/PGDATABASE)
#      against the CNPG cluster and writes /dump/romslig.pgdump in an emptyDir.
#   2. Main container archives /dump as a PBS .pxar snapshot — appends `--ns $PBS_NAMESPACE` and
#      `--keyfile /etc/pbs/keyfile` only when configured (see romslig-secrets.md).
#
# Prerequisites:
#   1. Create Secret `romslig-pbs-backup` (see romslig-secrets.md).
#   2. CNPG cluster `postgres-prod` Ready and `romslig-pg-secret` cloned into romslig-production.
#
# Trigger an immediate run (outside the schedule):
#   kubectl -n romslig-production create job --from=cronjob/romslig-pbs-backup romslig-pbs-backup-manual-$(date +%s)
#
# Image tag (PBS client): GitVersion MajorMinorPatch from .github/workflows/build-proxmox-pbs-backup-client.yml.
# PBS client image is linux/amd64 only; postgres:18-alpine is multi-arch but pinned to amd64 here for symmetry.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: romslig-pbs-backup
  namespace: romslig-production
spec:
  # 03:45 Europe/Oslo daily — staggered with authelia (03:00), clutterstock (03:30) and home-assistant (04:00) to spread PBS load.
  schedule: "45 3 * * *"
  timeZone: Europe/Oslo
  # Never run two concurrent dumps of the same DB — avoids pg_dump contention and PBS chunk-store locks.
  concurrencyPolicy: Forbid
  # If the cluster was down at the scheduled time, skip the run after 1h rather than backup at an odd hour.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Auto-delete the finished Job + its pod ~2 days after completion (TTL-after-finished
      # controller). Also reaps manual `--from=cronjob` runs, which the *JobsHistoryLimit don't.
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: romslig-pbs-backup
            app.kubernetes.io/component: romslig-pbs-backup
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          hostname: romslig-postgres
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            fsGroup: 1654
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
          - name: pgdump
            image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - 'pg_dump -Fc -f /dump/romslig.pgdump'
            env:
            - name: PGHOST
              value: postgres-prod-rw.postgres-production.svc.cluster.local
            - name: PGUSER
              value: romslig
            - name: PGDATABASE
              value: romslig
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: romslig-pg-secret
                  key: password
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: dump
              mountPath: /dump
          containers:
          - name: backup
            image: ghcr.io/hwinther/proxmox/proxmox/pbs/backup-client:0.7.3
            imagePullPolicy: IfNotPresent
            # pbs-job adds --ns (PBS_NAMESPACE) and --keyfile (/etc/pbs/keyfile) when set, then runs
            # proxmox-backup-client; the image has no shell.
            command:
            - /usr/bin/pbs-job
            args:
            - backup
            - db.pxar:/dump
            envFrom:
            - secretRef:
                name: romslig-pbs-backup
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: dump
              mountPath: /dump
            - name: pbs-keyfile
              mountPath: /etc/pbs
              readOnly: true
          volumes:
          - name: dump
            emptyDir: {}
          # Cluster-wide PBS encryption keyfile, cloned by Kyverno from platform-production.
          # When the source Secret is absent, the mount stays empty and --keyfile is not added.
          - name: pbs-keyfile
            secret:
              secretName: pbs-encryption-keyfile
              optional: true
              items:
              - key: keyfile
                path: keyfile
                mode: 0400
