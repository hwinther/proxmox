apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pbs-browser-preview-pr-69

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    pbs-browser.wsh.no/pr: "69"
  includeSelectors: false
  includeTemplates: true

# pr-69 / sha256:6efeb5c104b881d0b06941ffd68b95d1c9fcf84fd6191613ec246068473abf9c carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-69"
        digest: "sha256:6efeb5c104b881d0b06941ffd68b95d1c9fcf84fd6191613ec246068473abf9c"
- target:
    kind: Kustomization
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: pbs-browser-preview-pr-69
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: pbs-browser-69.preview.wsh.no
