apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pbs-browser-preview-pr-85

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    pbs-browser.wsh.no/pr: "85"
  includeSelectors: false
  includeTemplates: true

# pr-85 / sha256:8ebd642bdf0182a887bc03c2975f873592aeee49dfa0aa2d93dbcf43cc0bdcb7 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-85"
        digest: "sha256:8ebd642bdf0182a887bc03c2975f873592aeee49dfa0aa2d93dbcf43cc0bdcb7"
- target:
    kind: Kustomization
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: pbs-browser-preview-pr-85
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: pbs-browser-85.preview.wsh.no
