apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-54

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "54"
  includeSelectors: false
  includeTemplates: true

# pr-54 / sha256:fa6ec1de7867cac950af57e34067850fa759e7077c1f1314fa94b7a5fc98f2c6 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-54"
        digest: "sha256:fa6ec1de7867cac950af57e34067850fa759e7077c1f1314fa94b7a5fc98f2c6"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-54
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-54.preview.wsh.no
