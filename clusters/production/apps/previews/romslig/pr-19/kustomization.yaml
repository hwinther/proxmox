apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-19

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "19"
  includeSelectors: false
  includeTemplates: true

# pr-19 / sha256:4fb90c5e88b88b9043e4dab79494eee3c7ac6fdd7e239dd32b9dc17dd6653c00 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-19"
        digest: "sha256:4fb90c5e88b88b9043e4dab79494eee3c7ac6fdd7e239dd32b9dc17dd6653c00"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-19
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-19.preview.wsh.no
