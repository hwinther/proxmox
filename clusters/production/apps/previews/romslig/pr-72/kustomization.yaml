apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-72

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "72"
  includeSelectors: false
  includeTemplates: true

# pr-72 / sha256:bd487b29b7382ddbefa0b0bffc39e52936b0dd1d1416704ba1f5bee193d2e6f2 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-72"
        digest: "sha256:bd487b29b7382ddbefa0b0bffc39e52936b0dd1d1416704ba1f5bee193d2e6f2"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-72
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-72.preview.wsh.no
