apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-59

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "59"
  includeSelectors: false
  includeTemplates: true

# pr-59 / sha256:59b68bf6bea63fe72c7e503e08e8c2607ce95577540fb16fc791cd40112e8e61 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-59"
        digest: "sha256:59b68bf6bea63fe72c7e503e08e8c2607ce95577540fb16fc791cd40112e8e61"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-59
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-59.preview.wsh.no
