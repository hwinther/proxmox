apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-nightly

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "nightly"
  includeSelectors: false
  includeTemplates: true

# main / sha256:09cba6272e9c1a4bc502ddff0160770e84611f91f66bacd89800f1e733c1c7cf carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "main"
        digest: "sha256:09cba6272e9c1a4bc502ddff0160770e84611f91f66bacd89800f1e733c1c7cf"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-nightly
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-nightly.preview.wsh.no
