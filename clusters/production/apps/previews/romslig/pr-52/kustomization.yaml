apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-52

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "52"
  includeSelectors: false
  includeTemplates: true

# pr-52 / sha256:24b8caf763bb7d9e22ddeee356ccc57e1205b510a2904392c3c2d6b24f389def carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-52"
        digest: "sha256:24b8caf763bb7d9e22ddeee356ccc57e1205b510a2904392c3c2d6b24f389def"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-52
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-52.preview.wsh.no
