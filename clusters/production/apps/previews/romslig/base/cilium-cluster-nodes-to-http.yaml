# Allow cluster nodes to reach the preview pods on 8080: Traefik is hostNetwork (arrives as
# host/remote-node) and kubelet probes come via node IPs. Mirrors ../../../romslig.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-nodes-to-romslig-http
spec:
  endpointSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - romslig-api
      - romslig-web
  ingress:
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
