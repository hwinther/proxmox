apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-45

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "45"
  includeSelectors: false
  includeTemplates: true

# pr-45 / sha256:d923aae650c85704bbf08040d416e363e623e71266223e2b081bce6065878f87 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-45"
        digest: "sha256:d923aae650c85704bbf08040d416e363e623e71266223e2b081bce6065878f87"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-45
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-45.preview.wsh.no
