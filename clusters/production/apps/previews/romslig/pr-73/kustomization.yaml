apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-73

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "73"
  includeSelectors: false
  includeTemplates: true

# pr-73 / sha256:16dcc7e6eb19dd584612d84d4b0445a80e9c19179b9636a2f8c6078b3114e060 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-73"
        digest: "sha256:16dcc7e6eb19dd584612d84d4b0445a80e9c19179b9636a2f8c6078b3114e060"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-73
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-73.preview.wsh.no
