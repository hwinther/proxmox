apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-35

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "35"
  includeSelectors: false
  includeTemplates: true

# pr-35 / sha256:02e6ee7d9e827dbea6ad5eea255dd3537a398c3db6e3679d73a9e81b8c0cecfa carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-35"
        digest: "sha256:02e6ee7d9e827dbea6ad5eea255dd3537a398c3db6e3679d73a9e81b8c0cecfa"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-35
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-35.preview.wsh.no
