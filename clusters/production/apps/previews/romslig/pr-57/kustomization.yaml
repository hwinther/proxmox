apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-57

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "57"
  includeSelectors: false
  includeTemplates: true

# pr-57 / sha256:8f353ea83ca97884e3db06f0b0daa16d6c19ff4a4343efaab6a2f3c89ddd9b0f carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-57"
        digest: "sha256:8f353ea83ca97884e3db06f0b0daa16d6c19ff4a4343efaab6a2f3c89ddd9b0f"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-57
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-57.preview.wsh.no
