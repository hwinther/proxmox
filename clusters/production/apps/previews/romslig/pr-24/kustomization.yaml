apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-24

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "24"
  includeSelectors: false
  includeTemplates: true

# pr-24 / sha256:e81676933925ea9cfad6b6a74c180cc6c5197b00ecb2b10a18cac849058ef4e2 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-24"
        digest: "sha256:e81676933925ea9cfad6b6a74c180cc6c5197b00ecb2b10a18cac849058ef4e2"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-24
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-24.preview.wsh.no
