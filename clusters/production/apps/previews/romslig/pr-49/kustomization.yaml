apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-49

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "49"
  includeSelectors: false
  includeTemplates: true

# pr-49 / sha256:82f639c3825422599920cfb67ad4607cd1cdb6db1e3b741e378df1ba9fbf6afc carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-49"
        digest: "sha256:82f639c3825422599920cfb67ad4607cd1cdb6db1e3b741e378df1ba9fbf6afc"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-49
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-49.preview.wsh.no
