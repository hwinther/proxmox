apiVersion: v1
kind: Namespace
metadata:
  name: romslig-preview-pr-48
  annotations:
    # The only hostname this preview's HTTPRoute may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: "romslig-48.preview.wsh.no"
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for the HTTPRoute's ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: romslig
    romslig.wsh.no/preview: "true"
    romslig.wsh.no/pr: "48"
