apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romslig-preview-pr-50

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false: identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    romslig.wsh.no/pr: "50"
  includeSelectors: false
  includeTemplates: true

# pr-50 / sha256:752c4ba67cd3f115cf936004d852b60a73c17234187ea65126aa17c781c3cac2 carry the MANIFEST ARTIFACT's tag (pr-<N>, or main for the nightly)
# and digest, not an image's: the artifact pins the api and web images itself. The digest pins the
# deploy to exactly what the run pushed after e2e + Grype; the tag is kept alongside for readability
# (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: romslig
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-50"
        digest: "sha256:752c4ba67cd3f115cf936004d852b60a73c17234187ea65126aa17c781c3cac2"
- target:
    kind: Kustomization
    name: romslig
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: romslig-preview-pr-50
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: romslig-50.preview.wsh.no
