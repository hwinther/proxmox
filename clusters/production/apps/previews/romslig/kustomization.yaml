# Parent kustomization for romslig preview environments. Maintained by the gitops-preview-upsert.yml /
# gitops-preview-teardown.yml reusable workflows in hwinther/reusable-workflows: they add/remove
# pr-<N> (and `nightly`) entries below as PRs labelled `deploy-feature` are opened/closed in
# wshno/romslig, and around its nightly-preview.yml run.
#
# No `databases` entry and no kyverno-generatingpolicies: a romslig preview runs without PostgreSQL
# (PG_HOST empty, so the API keeps projects in its file store inside the pod) and in byok AI mode (no
# Anthropic key), so it needs no database, no secret and no pull credential (the GHCR packages
# ghcr.io/wshno/romslig/* are public). Starts empty; the workflow's `yq` creates/extends the
# resources list as previews are deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pr-24
