apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clutterstock-preview-pr-478

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false avoids leaking the PR label
# into NetworkPolicy podSelectors that target peers in other namespaces (kube-dns, redis, etc.).
labels:
- pairs:
    clutterstock.wsh.no/pr: "478"
  includeSelectors: false
  includeTemplates: true

# pr-478 / sha256:93b19583da78b829975d70b22474a3c80383843da6d575bb1176b9aa67b8e2ac carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not an
# image's: the artifact pins the api, migrator and frontend images itself. The digest pins the
# deploy to exactly what this PR run pushed after e2e + grype; the tag is kept alongside for
# readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-478"
        digest: "sha256:93b19583da78b829975d70b22474a3c80383843da6d575bb1176b9aa67b8e2ac"
- target:
    kind: Kustomization
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: clutterstock-preview-pr-478
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: clutterstock-478.preview.wsh.no
    - op: replace
      path: /spec/postBuild/substitute/PG_DB
      value: clutterstock_pr478
