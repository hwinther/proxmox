apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clutterstock-preview-pr-454

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false avoids leaking the PR label
# into NetworkPolicy podSelectors that target peers in other namespaces (kube-dns, redis, etc.).
labels:
- pairs:
    clutterstock.wsh.no/pr: "454"
  includeSelectors: false
  includeTemplates: true

# pr-454 / sha256:3e29f6455104cb4621fe974ced8651fc150371cd9d8cf339fefd43ee2acab79e carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not an
# image's: the artifact pins the api, migrator and frontend images itself. The digest pins the
# deploy to exactly what this PR run pushed after e2e + grype; the tag is kept alongside for
# readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-454"
        digest: "sha256:3e29f6455104cb4621fe974ced8651fc150371cd9d8cf339fefd43ee2acab79e"
- target:
    kind: Kustomization
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: clutterstock-preview-pr-454
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: clutterstock-454.preview.wsh.no
    - op: replace
      path: /spec/postBuild/substitute/PG_DB
      value: clutterstock_pr454
