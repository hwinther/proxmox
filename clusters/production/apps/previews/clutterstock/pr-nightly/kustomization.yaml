apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clutterstock-preview-pr-nightly

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false avoids leaking the PR label
# into NetworkPolicy podSelectors that target peers in other namespaces (kube-dns, redis, etc.).
labels:
- pairs:
    clutterstock.wsh.no/pr: "nightly"
  includeSelectors: false
  includeTemplates: true

# main / sha256:5307a348d8402ee35a5788d4a5b8925ab2f1f84bfdd73eb628fc6b47ba4f3c21 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not an
# image's: the artifact pins the api, migrator and frontend images itself. The digest pins the
# deploy to exactly what this PR run pushed after e2e + grype; the tag is kept alongside for
# readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "main"
        digest: "sha256:5307a348d8402ee35a5788d4a5b8925ab2f1f84bfdd73eb628fc6b47ba4f3c21"
- target:
    kind: Kustomization
    name: clutterstock
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: clutterstock-preview-pr-nightly
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: clutterstock-nightly.preview.wsh.no
    - op: replace
      path: /spec/postBuild/substitute/PG_DB
      value: clutterstock_nightly
