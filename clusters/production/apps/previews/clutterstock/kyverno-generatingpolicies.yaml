# Policies that clone the Secrets a ClutterStock preview env needs into every namespace
# labeled `clutterstock.wsh.no/preview=true`. Same label-driven generate pattern as
# `clone-pbs-encryption-keyfile` in platform-production — see pbs-encryption-keyfile.md and the
# pbs-encryption-keyfile-label-clone memory for the rationale.
#
# Kyverno's validate-policy webhook does a static SAR against `{{request.object.metadata.name}}` on
# generate rules, which per-namespace RoleBindings cannot satisfy. The cluster-wide Secret RBAC for
# Kyverno admission+background controllers was already added by the PBS work
# (kyverno-clusterrole-clone-pbs-encryption-keyfile.yaml), so no extra RBAC is needed here.
#
# Trigger: a Namespace gets created (e.g. by the upsert workflow) with the preview label, OR an
# existing namespace is labelled. `generateExisting: true` also re-applies on policy install so any
# preview namespace already on the cluster gets the Secrets immediately.
# CEL GeneratingPolicy (policies.kyverno.io/v1); replaced the kyverno.io/v1 ClusterPolicy removed in Kyverno 1.20.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: clone-clutterstock-preview-secrets
  annotations:
    policies.kyverno.io/title: Clone ClutterStock preview-env Secrets
    policies.kyverno.io/category: ClutterStock
    policies.kyverno.io/severity: low
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Keep generated Secrets if this policy is ever deleted (Kyverno's default deletes them).
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    objectSelector:
      matchLabels:
        clutterstock.wsh.no/preview: "true"
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [namespaces]
  variables:
  - name: cluttertestdbApp
    expression: resource.get("v1", "secrets", "postgres-test", "cluttertestdb-app")
  - name: clutterstockTestRabbitmq
    expression: resource.get("v1", "secrets", "clutterstock-test", "clutterstock-test-rabbitmq")
  # Generated, not cloned (see the comment at the top of this file). data is base64 of redis://redis:6379/0.
  - name: clutterstockValkey
    expression: >-
      {
        "apiVersion": dyn("v1"),
        "kind": dyn("Secret"),
        "metadata": dyn({"name": "clutterstock-valkey"}),
        "type": dyn("Opaque"),
        "data": dyn({"redis-url": "cmVkaXM6Ly9yZWRpczo2Mzc5LzA="})
      }
  generate:
  - expression: generator.apply(object.metadata.name, [variables.cluttertestdbApp, variables.clutterstockTestRabbitmq, variables.clutterstockValkey])
