# The preview workload (API with the migrator as its initContainer, frontend, Ingress) comes from the
# PR's manifest artifact, ghcr.io/hwinther/clutterstock/manifests:pr-<N>, which ClutterStock's
# pr-e2e.yml renders from the PR's deploy/ (same render as a release, PR images pinned) and signs.
# The per-PR overlay pins the artifact by digest and sets targetNamespace, APP_HOST and PG_DB.
#
# Everything else is the test tier's wiring (../../../clutterstock-test/clutterstock-manifests.yaml):
# the shared cluttertestdb cluster (one database per PR, ../databases/), the RabbitMQ `test` vhost,
# and the Secrets Kyverno clones in (../kyverno-clusterpolicies.yaml). Previews get no homepage tile.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: clutterstock
spec:
  interval: 10m
  url: oci://ghcr.io/hwinther/clutterstock/manifests
  ref:
    tag: placeholder # patched per PR (tag + digest)
  # Only artifacts signed by ClutterStock's PR workflow. Test and production accept release-tag
  # signatures only, so a PR artifact can't be promoted there.
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/hwinther/ClutterStock/\.github/workflows/pr-e2e\.yml@refs/pull/[0-9]+/merge$
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clutterstock
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: clutterstock
  path: ./
  prune: true
  wait: true
  # The migrator initContainer retries until CNPG has created the per-PR database.
  timeout: 5m
  targetNamespace: placeholder # patched per PR
  # Strings only: kustomize drops the quotes around a substituted value.
  postBuild:
    substitute:
      APP_HOST: placeholder # patched per PR
      APP_ENVIRONMENT: preview
      OIDC_AUTHORITY: https://auth.wsh.no
      PG_HOST: cluttertestdb-rw.postgres-test.svc.cluster.local
      PG_DB: placeholder # patched per PR
      PG_USER: app
      PG_SECRET: cluttertestdb-app
      RABBITMQ_HOST: rabbitmq.rabbitmq-production.svc.cluster.local
      RABBITMQ_VHOST: test
      RABBITMQ_SECRET: clutterstock-test-rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://obs-otel-collector.observability-production.svc.cluster.local:4317
  patches:
  - target:
      kind: Ingress
      name: clutterstock
    patch: |-
      - op: replace
        path: /metadata/annotations/gethomepage.dev~1enabled
        value: "false"
