apiVersion: v1
kind: Namespace
metadata:
  name: test-preview-pr-nightly
  annotations:
    # The only hostname this preview's HTTPRoute may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: "test-nightly.preview.wsh.no"
  labels:
    app.kubernetes.io/part-of: test
    test.wsh.no/preview: "true"
    test.wsh.no/pr: "nightly"
    # trust-manager renders the wsh-internal-ca ConfigMap here (the API mounts it for RabbitMQ TLS).
    wsh.no/trust-bundle: "true"
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); the artifact ships one.
    gateway.wsh.no/traefik: "true"
