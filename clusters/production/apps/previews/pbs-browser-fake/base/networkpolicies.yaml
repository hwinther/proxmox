# Fake-data env: no egress to PBS (PBS_FAKE never runs the client). Ingress under Cilium is handled by
# cilium-cluster-nodes-to-http.yaml (Traefik is host-network); this rule is kept for parity with
# ../../pbs-browser/base/networkpolicies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pbs-browser
spec:
  podSelector:
    matchLabels:
      app: pbs-browser
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # OTLP/HTTP to the collector: CSP violation reports (Security/CspReports.cs in pbs-browser).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-production
    ports:
    - port: 4318
      protocol: TCP
