apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pbs-browser-fake-nightly

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    pbs-browser.wsh.no/fake-env: "nightly"
  includeSelectors: false
  includeTemplates: true

# main / sha256:47d6d6b65a9e9b8a9b732e0a049858aba4c00574486a4f7f5fae20192e181028 carry the MANIFEST ARTIFACT's tag (main) and digest, not the
# image's: the artifact pins the image itself.
patches:
- target:
    kind: OCIRepository
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "main"
        digest: "sha256:47d6d6b65a9e9b8a9b732e0a049858aba4c00574486a4f7f5fae20192e181028"
- target:
    kind: Kustomization
    name: pbs-browser
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: pbs-browser-fake-nightly
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: pbs-browser-nightly.preview.wsh.no
