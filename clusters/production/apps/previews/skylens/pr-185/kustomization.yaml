apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-185

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "185"
  includeSelectors: false
  includeTemplates: true

# pr-185 / sha256:b45a519a20870168e801ec0d4962d39352d3d49463c2ff7823a59844dcf15b6e carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-185"
        digest: "sha256:b45a519a20870168e801ec0d4962d39352d3d49463c2ff7823a59844dcf15b6e"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-185
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-185.preview.wsh.no
