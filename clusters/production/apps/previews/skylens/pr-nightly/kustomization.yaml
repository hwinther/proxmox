apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-nightly

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "nightly"
  includeSelectors: false
  includeTemplates: true

# main / sha256:ae84c95d3aef6ec1a5111b7131737e63ed3a2267b5fb53b85e2c968d2b93a526 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "main"
        digest: "sha256:ae84c95d3aef6ec1a5111b7131737e63ed3a2267b5fb53b85e2c968d2b93a526"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-nightly
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-nightly.preview.wsh.no
