apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-160

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "160"
  includeSelectors: false
  includeTemplates: true

# pr-160 / sha256:da05f7ee67abf0d022a6238c4af70358c2c0866042cff424bc4dc0cae50fcce2 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-160"
        digest: "sha256:da05f7ee67abf0d022a6238c4af70358c2c0866042cff424bc4dc0cae50fcce2"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-160
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-160.preview.wsh.no
