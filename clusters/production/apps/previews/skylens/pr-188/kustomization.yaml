apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-188

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "188"
  includeSelectors: false
  includeTemplates: true

# pr-188 / sha256:bfacfb9c656f2770f9df1202abe9b30a9c31dee157c2bcacae0bd670bcbeb23b carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-188"
        digest: "sha256:bfacfb9c656f2770f9df1202abe9b30a9c31dee157c2bcacae0bd670bcbeb23b"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-188
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-188.preview.wsh.no
