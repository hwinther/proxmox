apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-184

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "184"
  includeSelectors: false
  includeTemplates: true

# pr-184 / sha256:a6e059ebefb56c272e5fe4088517513af7532b5f5a2342d3d998e14efbb8b1ad carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-184"
        digest: "sha256:a6e059ebefb56c272e5fe4088517513af7532b5f5a2342d3d998e14efbb8b1ad"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-184
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-184.preview.wsh.no
