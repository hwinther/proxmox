apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-158

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "158"
  includeSelectors: false
  includeTemplates: true

# pr-158 / sha256:fb457187c29931dffccfdb6d882779b64d7b590f359ef54662d7212bc82838d3 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-158"
        digest: "sha256:fb457187c29931dffccfdb6d882779b64d7b590f359ef54662d7212bc82838d3"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-158
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-158.preview.wsh.no
