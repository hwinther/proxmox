apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-159

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "159"
  includeSelectors: false
  includeTemplates: true

# pr-159 / sha256:4a0528f3dcd690b3867fdee896aa8950eed85383b066d46838ecd6502e30ab8d carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-159"
        digest: "sha256:4a0528f3dcd690b3867fdee896aa8950eed85383b066d46838ecd6502e30ab8d"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-159
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-159.preview.wsh.no
