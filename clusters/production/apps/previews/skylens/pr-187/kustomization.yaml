apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-187

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "187"
  includeSelectors: false
  includeTemplates: true

# pr-187 / sha256:096dd57300a843c74c92a39fb2000924baee22dedce38e0cb1b711cfb92e1cea carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-187"
        digest: "sha256:096dd57300a843c74c92a39fb2000924baee22dedce38e0cb1b711cfb92e1cea"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-187
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-187.preview.wsh.no
