apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skylens-preview-pr-181

resources:
- ../base
- namespace.yaml

# `labels` (vs deprecated `commonLabels`) with includeSelectors: false — identification only; keeps
# the PR label out of selectors so it can't break the netpol-baseline same-namespace matching.
labels:
- pairs:
    skylens.wsh.no/pr: "181"
  includeSelectors: false
  includeTemplates: true

# pr-181 / sha256:fbf2849b0aa1cf5b53ecae4921d520f9b9b8ff7929b1bc96c2bb365e3a389251 carry the MANIFEST ARTIFACT's tag (pr-<N>) and digest, not the
# image's: the artifact pins the image itself. The digest pins the deploy to exactly what this PR
# run pushed; the tag is kept alongside for readability (`flux get sources oci`).
patches:
- target:
    kind: OCIRepository
    name: skylens
  patch: |-
    - op: replace
      path: /spec/ref
      value:
        tag: "pr-181"
        digest: "sha256:fbf2849b0aa1cf5b53ecae4921d520f9b9b8ff7929b1bc96c2bb365e3a389251"
- target:
    kind: Kustomization
    name: skylens
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: skylens-preview-pr-181
    - op: replace
      path: /spec/postBuild/substitute/APP_HOST
      value: skylens-181.preview.wsh.no
