# External (internet-vantage) endpoint probing. The blackbox-exporter runs on the off-cluster VPS
# (see infra/blackbox-vps/) so probes traverse the real public path — external DNS, the internet, the
# nginx TLS front-end — catching user-facing failures the in-cluster metrics miss (e.g. the front-end
# truncation incident). Prometheus reaches the VPS blackbox over the existing tunnel.
#
# prober.url is the VPS's TUNNEL IP (10.31.0.3) — not its public IP; the exporter binds to the tunnel
# only. Keep this in sync with TUNNEL_IP in infra/blackbox-vps/.
#
# release=obs-kps so the operator probeSelector picks these up. Each target series gets instance=<url>
# and the probe_origin=vps-external label (used by prometheusrule-blackbox.yaml).
#
# mgmt endpoints are intentionally NOT probed: *.mgmt.wsh.no resolves to LAN IPs and is unreachable
# from the internet by design.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-core-apps
  namespace: observability-production
  labels:
    release: obs-kps
spec:
  interval: 60s
  scrapeTimeout: 15s
  # http_2xx module (defined in infra/blackbox-vps/blackbox.yml) requires HTTP 2xx + valid TLS.
  module: http_2xx
  prober:
    url: 10.31.0.3:9115
    scheme: http
  targets:
    staticConfig:
      static:
      - https://www.wsh.no
      labels:
        probe_origin: vps-external
---
# Auth-gated / redirecting public services: an unauthenticated GET legitimately returns 200/3xx/401/403,
# so the lenient http_public module treats those as success (still fails on 5xx / TLS errors / timeouts).
# Re-bucket hosts between this and external-core-apps as you learn each one's real response.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-public-services
  namespace: observability-production
  labels:
    release: obs-kps
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_public
  prober:
    url: 10.31.0.3:9115
    scheme: http
  targets:
    staticConfig:
      static:
      # clutterstock 302s on / (app redirect), so it lives here rather than the strict http_2xx Probe.
      - https://clutterstock.wsh.no
      - https://auth.wsh.no
      - https://ddns.wsh.no
      - https://node-red.wsh.no
      - https://home-assistant.wsh.no
      labels:
        probe_origin: vps-external
---
# charybdis IRC servers on the two edge VPSes (abyss = abyss.nl.eu, dns-master = odyssey.de.eu), probed
# over TLS on 6697 with the irc_tls module (TLS handshake + the ircd's first NOTICE, then QUIT).
# Same probe_origin as the HTTP probes, so ExternalEndpointDown and ExternalEndpointCertExpiringSoon
# in prometheusrule-blackbox.yaml cover them.
#
# Cross-probed: each server is checked by the blackbox on the OTHER VPS (abyss runs a second instance
# on its tunnel IP 10.31.0.2), so a pass means the ircd is reachable over the internet, not only on
# its own host. The prober label says which VPS ran the check. If one blackbox is down its Probe
# scrape fails (up=0, TargetDown) instead of reporting the ircd as down.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-irc-from-dns-master
  namespace: observability-production
  labels:
    release: obs-kps
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: irc_tls
  prober:
    url: 10.31.0.3:9115
    scheme: http
  targets:
    staticConfig:
      static:
      - abyss.nl.eu.darkmyst.org:6697
      labels:
        probe_origin: vps-external
        service: irc
        prober: dns-master
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-irc-from-abyss
  namespace: observability-production
  labels:
    release: obs-kps
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: irc_tls
  prober:
    url: 10.31.0.2:9115
    scheme: http
  targets:
    staticConfig:
      static:
      - odyssey.de.eu.darkmyst.org:6697
      labels:
        probe_origin: vps-external
        service: irc
        prober: abyss
