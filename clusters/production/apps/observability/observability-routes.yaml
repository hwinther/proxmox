apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "Grafana"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - grafana.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: obs-kps-grafana
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otel-cors
  namespace: observability-production
spec:
  headers:
    accessControlAllowMethods:
    - GET
    - POST
    - OPTIONS
    accessControlAllowHeaders:
    - Accept
    - Content-Type
    - Authorization
    # W3C Trace Context — browser may send these on OTLP or preflight; avoids dropped headers vs simple allowlist
    - traceparent
    - tracestate
    - baggage
    accessControlAllowOriginList:
    - https://clutterstock.wsh.no
    - https://clutterstock.test.wsh.no
    - https://redis-prod.mgmt.wsh.no
    - https://redis-test.mgmt.wsh.no
    - https://test.test.wsh.no
    accessControlMaxAge: 3600
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector-otlp-http
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/name: "OpenTelemetry Collector"
    gethomepage.dev/siteMonitor: "https://otel.mgmt.wsh.no"
    gethomepage.dev/icon: "si-opentelemetry"
    gethomepage.dev/description: "OTLP HTTP endpoint"
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=obs-otel-collector"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - otel.mgmt.wsh.no
  - otel.test.wsh.no
  - otel.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: otel-cors
    backendRefs:
    - name: obs-otel-collector
      port: 4318
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-collector-otlp-http-app-host-traces
  namespace: observability-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Each app's own Ingress has a `/` catch-all on the same host. Traefik's default priority is
    # the rule length, which let the app win against the *.preview.wsh.no HostRegexp rule (the
    # nightly preview still got 404 on /v1/traces). An explicit priority above any rule length
    # makes /v1/traces reach the collector on every host listed here, and only that path.
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  rules:
  - host: test.test.wsh.no
    http:
      paths:
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: obs-otel-collector
            port:
              number: 4318
  - host: clutterstock.test.wsh.no
    http:
      paths:
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: obs-otel-collector
            port:
              number: 4318
  - host: clutterstock.wsh.no
    http:
      paths:
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: obs-otel-collector
            port:
              number: 4318
  # Every preview env (PR previews and ClutterStock's nightly): their frontends send browser traces
  # to https://<host>/v1/traces like test and production.
  - host: "*.preview.wsh.no"
    http:
      paths:
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: obs-otel-collector
            port:
              number: 4318
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "Alertmanager"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - alertmanager.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: obs-kps-kube-prometheus-st-alertmanager
      port: 9093
