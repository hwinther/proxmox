apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "Grafana"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - grafana.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: obs-kps-grafana
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otel-cors
  namespace: observability-production
spec:
  headers:
    accessControlAllowMethods:
    - GET
    - POST
    - OPTIONS
    accessControlAllowHeaders:
    - Accept
    - Content-Type
    - Authorization
    # W3C Trace Context — browser may send these on OTLP or preflight; avoids dropped headers vs simple allowlist
    - traceparent
    - tracestate
    - baggage
    accessControlAllowOriginList:
    - https://clutterstock.wsh.no
    - https://clutterstock.test.wsh.no
    - https://redis-prod.mgmt.wsh.no
    - https://redis-test.mgmt.wsh.no
    - https://test.test.wsh.no
    accessControlMaxAge: 3600
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector-otlp-http
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/name: "OpenTelemetry Collector"
    gethomepage.dev/siteMonitor: "https://otel.mgmt.wsh.no"
    gethomepage.dev/icon: "si-opentelemetry"
    gethomepage.dev/description: "OTLP HTTP endpoint"
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=obs-otel-collector"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - otel.mgmt.wsh.no
  - otel.test.wsh.no
  - otel.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: otel-cors
    backendRefs:
    - name: obs-otel-collector
      port: 4318
---
# Same-host OTLP HTTP traces: browsers POST to https://<app-host>/v1/traces, and this route sends that
# one path to the collector :4318 (same origin, so no CORS), while each app's own HTTPRoute serves the
# rest of its host.
#
# Precedence relies on Traefik's Gateway provider, which ranks by path before hostname: PathPrefix
# /v1/traces scores 10000 + 10*100 (+ host length) against 1 (+ host length) for an app's PathPrefix /,
# so it wins even for *.preview.wsh.no against a preview's exact host. The Gateway API spec ranks an
# exact hostname above a wildcard; a strictly conformant implementation (e.g. Cilium) would send preview
# /v1/traces to the app instead. Revisit this route if the Gateway controller changes.
#
# The hosts are other apps' hostnames, so observability-production's hostname grant lists them too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector-otlp-http-app-host-traces
  namespace: observability-production
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - test.test.wsh.no
  - clutterstock.test.wsh.no
  - clutterstock.wsh.no
  # Every preview env (PR previews and ClutterStock's nightly).
  - "*.preview.wsh.no"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/traces
    backendRefs:
    - name: obs-otel-collector
      port: 4318
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: observability-production
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: "Alertmanager"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - alertmanager.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: obs-kps-kube-prometheus-st-alertmanager
      port: 9093
