apiVersion: v1
kind: Namespace
metadata:
  name: observability-production
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: grafana.mgmt.wsh.no,otel.mgmt.wsh.no,otel.test.wsh.no,otel.wsh.no,alertmanager.mgmt.wsh.no,test.test.wsh.no,clutterstock.test.wsh.no,clutterstock.wsh.no,*.preview.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: production
    # Triggers cluster-wide Kyverno ClusterPolicy clone-pbs-encryption-keyfile
    # to clone the keyfile Secret from platform-production into this namespace.
    pbs.wsh.no/encryption-keyfile: "true"
