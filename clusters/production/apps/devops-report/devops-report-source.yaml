# The daily repository report from wshno/devops (.github/workflows/report.yml): index.html and
# data.json in ConfigMap `devops-report`, shipped as the cosign-signed OCI artifact
# ghcr.io/wshno/devops/report:latest. The workflow overwrites :latest every 6 hours (and on manual
# runs); Flux picks up the new digest within the interval and kubelet swaps the mounted files in
# nginx (no restart).
#
# Prereq (out-of-band): Secret `ghcr-pull` in this namespace, because wshno/devops is private and so
# is its package. See devops-report-secrets.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: devops-report
spec:
  # Each poll only resolves the tag's digest; the artifact is pulled (and verified) when it changes.
  interval: 5m
  url: oci://ghcr.io/wshno/devops/report
  ref:
    tag: latest
  secretRef:
    name: ghcr-pull
  # Only artifacts signed by the report workflow on main are applied.
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/wshno/devops/\.github/workflows/report\.yml@refs/heads/main$
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devops-report
spec:
  interval: 15m
  retryInterval: 5m
  sourceRef:
    kind: OCIRepository
    name: devops-report
  path: ./
  prune: true
  timeout: 2m
  targetNamespace: devops-report-production
