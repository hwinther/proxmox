apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: production
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  # Detect manual changes to Helm-managed resources (warn-only; flip to enabled per-release once proven quiet).
  driftDetection:
    mode: warn
  interval: 30m
  ## CRDs applied from traefik-crds.yaml (same chart version); avoid Helm/Flux ordering issues.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "42.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    deployment:
      kind: DaemonSet
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    hostNetwork: true
    # Gateway API is the only way in. HTTPRoute hostnames are bound to namespace grants
    # (httproute-hostnames-policy.yaml), and the Ingress provider would serve any Ingress (with this
    # class or none) past that check, so it's off, together with the chart's IngressClass.
    # kubernetesCRD stays for the Middlewares that HTTPRoutes reference through ExtensionRef filters.
    # ExtensionRef is always namespace-local, so no cross-namespace Middleware references.
    # IngressRoutes are refused by traefik-ingressroute-policy.yaml.
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        allowCrossNamespace: false
      # CRDs: ../gateway-api (standard channel only, so experimentalChannel stays off). Traefik serves
      # the Gateway in gateway.yaml.
      # statusAddress: the Service is ClusterIP (hostNetwork DaemonSet), so there's no LB address to
      # copy into Gateway status.
      kubernetesGateway:
        enabled: true
        statusAddress:
          service:
            enabled: false
    # The chart's default Gateway is off; the platform Gateway is gateway.yaml. Keep the chart's
    # GatewayClass (controllerName traefik.io/gateway-controller) with a fixed name.
    gateway:
      enabled: false
    ingressClass:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    # Sized from observed usage (1-2m CPU, 74-126Mi across the DaemonSet); no CPU limit
    # to avoid throttling the ingress data path.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Chart v40 moved Service.type under service.spec (PR #1686, "align syntax with
    # upstream"). hostNetwork DaemonSet ingress comes in via the node, so keep ClusterIP
    # rather than the new LoadBalancer default.
    service:
      spec:
        type: ClusterIP
    ports:
      traefik:
        port: 9000
        expose:
          default: false
      web:
        port: 8000
        expose:
          default: true
        forwardedHeaders:
          trustedIPs:
          - 10.20.0.0/16
      websecure:
        port: 8444
        expose:
          default: true
