apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
## CRDs must exist before other bundles reference traefik.io (e.g. Middleware in observability).
resources:
- traefik-crds.yaml
- traefik-helmrelease.yaml
# Platform Gateway + HTTPRoute hostname policy, shared with edge-sdr (CRDs: ../gateway-api).
- ../../../../bases/traefik-gateway
# No IngressRoutes (they would bypass the hostname grants too).
- traefik-ingressroute-policy.yaml
