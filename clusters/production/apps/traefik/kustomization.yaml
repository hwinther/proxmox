apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
## CRDs must exist before other bundles reference traefik.io (e.g. Middleware in observability).
resources:
- traefik-crds.yaml
- traefik-helmrelease.yaml
# Platform Gateway (Gateway API CRDs come from ../gateway-api).
- gateway.yaml
# HTTPRoute hostnames must be granted by the namespace (gateway.wsh.no/hostnames).
- httproute-hostnames-policy.yaml
