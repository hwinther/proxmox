# The six GeneratingPolicies that clone CNPG app Secrets (clone-*-pg-secret-*, clone-*-app-secret-*)
# match on Secret. Kyverno marks a policy ready only when the reports controller can get/list/watch
# what it matches, so without this they show ready=false with "Policy is not ready for reporting,
# missing permissions: get/list/watch secrets" (seen since 2026-11-07; the cloning itself is done by
# the background controller, which already has this through
# kyverno-clusterrole-aggregate-background-secrets-read.yaml).
#
# Trade-off: the reports controller can now read Secret data cluster-wide, as the admission and
# background controllers already can. Aggregates into ClusterRole kyverno-kyverno:reports-controller
# (chart aggregationRule).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-kyverno:aggregate:reports-secrets-read
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
