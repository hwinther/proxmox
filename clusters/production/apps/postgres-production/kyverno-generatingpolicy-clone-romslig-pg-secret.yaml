# Clone romslig-pg-secret into romslig-production for secretKeyRef on the API Deployment and the PBS backup/restore Jobs.
# CEL GeneratingPolicy (policies.kyverno.io/v1); replaced the kyverno.io/v1 ClusterPolicy removed in Kyverno 1.20.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: clone-romslig-pg-secret-to-romslig-production
  annotations:
    policies.kyverno.io/title: Clone romslig-pg-secret to romslig-production
    policies.kyverno.io/category: CNPG
    policies.kyverno.io/severity: low
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Keep generated Secrets if this policy is ever deleted (Kyverno's default deletes them).
    orphanDownstreamOnPolicyDelete:
      enabled: true
  # Trigger: the source Secret itself (create/update), so changes are re-cloned right away.
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: postgres-production
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
      resourceNames: [romslig-pg-secret]
  variables:
  - name: source
    expression: resource.get("v1", "secrets", "postgres-production", "romslig-pg-secret")
  generate:
  - expression: generator.apply("romslig-production", [variables.source])
