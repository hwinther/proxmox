# Clone clutterstock-pg-secret into clutterstock-production for secretKeyRef on the API Deployment.
# CEL GeneratingPolicy (policies.kyverno.io/v1); replaced the kyverno.io/v1 ClusterPolicy removed in Kyverno 1.20.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: clone-clutterstock-pg-secret-to-clutterstock-production
  annotations:
    policies.kyverno.io/title: Clone clutterstock-pg-secret to clutterstock-production
    policies.kyverno.io/category: CNPG
    policies.kyverno.io/severity: low
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Keep generated Secrets if this policy is ever deleted (Kyverno's default deletes them).
    orphanDownstreamOnPolicyDelete:
      enabled: true
  # Trigger: the source Secret itself (create/update), so changes are re-cloned right away.
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: postgres-production
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
      resourceNames: [clutterstock-pg-secret]
  variables:
  - name: source
    expression: resource.get("v1", "secrets", "postgres-production", "clutterstock-pg-secret")
  generate:
  - expression: generator.apply("clutterstock-production", [variables.source])
