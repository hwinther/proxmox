# Clone authelia-pg-secret into authelia-production for the PBS backup/restore Jobs' pg_dump
# init container (Authelia itself reads the password from the separate authelia-storage Secret).
# CEL GeneratingPolicy (policies.kyverno.io/v1); replaced the kyverno.io/v1 ClusterPolicy removed in Kyverno 1.20.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: clone-authelia-pg-secret-to-authelia-production
  annotations:
    policies.kyverno.io/title: Clone authelia-pg-secret to authelia-production
    policies.kyverno.io/category: CNPG
    policies.kyverno.io/severity: low
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Keep generated Secrets if this policy is ever deleted (Kyverno's default deletes them).
    orphanDownstreamOnPolicyDelete:
      enabled: true
  # Trigger: the source Secret itself (create/update), so changes are re-cloned right away.
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: postgres-production
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
      resourceNames: [authelia-pg-secret]
  variables:
  - name: source
    expression: resource.get("v1", "secrets", "postgres-production", "authelia-pg-secret")
  generate:
  - expression: generator.apply("authelia-production", [variables.source])
