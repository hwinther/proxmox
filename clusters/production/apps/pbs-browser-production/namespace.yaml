apiVersion: v1
kind: Namespace
metadata:
  name: pbs-browser-production
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: pbs-browser.mgmt.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: pbs-browser-production
    # Kyverno clones the cluster-wide PBS client-side encryption keyfile into this namespace
    # (clone-pbs-encryption-keyfile ClusterPolicy in platform-production).
    pbs.wsh.no/encryption-keyfile: "true"
