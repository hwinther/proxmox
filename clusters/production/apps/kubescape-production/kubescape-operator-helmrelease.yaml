apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape-production
spec:
  # Detect manual changes to Helm-managed resources (warn-only; flip to enabled per-release once proven quiet).
  driftDetection:
    mode: warn
  interval: 30m
  # node-agent pulls eBPF-heavy image and waits for /readyz on every node; allow slow clusters.
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kubescape-operator
      version: "1.40.3"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: kubescape-production
  values:
    # hostScanner defaults include control-plane tolerations; node-agent and storage fall back to
    # customScheduling — without this, DaemonSets / storage may never schedule on k0s controllers.
    customScheduling:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    clusterName: production
    ksNamespace: kubescape-production
    excludeNamespaces: "kubescape,kubescape-production,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public"
    # networkPolicyService disabled 2026-08-28: node-agents continuously build network
    # neighborhoods and stream them into the single `storage` aggregated apiserver, which sat at a
    # flat 627m CPU floor (7d min == median) — 76% of the namespace's 826m and 38% of all CPU
    # consumed cluster-wide, while the actual image scanner (kubevuln) floored at 6m. We already
    # maintain a hand-written netpol baseline, so the generated policy suggestions are redundant.
    # Re-enable if we ever want generated CiliumNetworkPolicy suggestions back.
    capabilities:
      continuousScan: enable
      networkPolicyService: disable
    # k0s: node-agent /readyz was HTTP 500 with privileged: false (eBPF/debugfs); required for runtime/network features.
    nodeAgent:
      privileged: true
    # storage is a single cluster-wide aggregated apiserver ingesting behavioral-profile writes
    # from every node-agent DaemonSet pod; chart default request (100m) undersells real usage —
    # observed steady-state ~625m (see kubescape-storage-cpu-request-undersized memory).
    storage:
      resources:
        requests:
          cpu: 600m
          memory: 400Mi
        limits:
          cpu: 1500m
          memory: 1500Mi
