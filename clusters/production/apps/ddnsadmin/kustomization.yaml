# Aggregator for the production-shape ddnsadmin instances. To add another instance (e.g. a
# friend's): create ./<instance>/{namespace.yaml,kustomization.yaml,ddnsadmin-manifests.yaml}
# (copy test/, then set targetNamespace, APP_HOST and SUPERUSER_EMAIL), add the line below, create
# the two prerequisite Secrets per base/secrets-bootstrap.md, and Flux picks it up.
#
# PR-preview instances are NOT routed through here — they live under ../previews/ddnsadmin/ and
# apply the artifact's demo render (in-pod BIND, ephemeral, runs-as-root).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- kyverno-clusterpolicies.yaml
- production
- test
