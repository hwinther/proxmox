apiVersion: v1
kind: Namespace
metadata:
  name: ddnsadmin-production
  annotations:
    # Hostnames HTTPRoutes here may claim (bases/traefik-gateway/httproute-hostnames-policy.yaml).
    gateway.wsh.no/hostnames: ddns.wsh.no
  labels:
    # May attach HTTPRoutes to the platform Gateway (bases/traefik-gateway/gateway.yaml); Kyverno also puts the
    # authelia-forwardauth Middleware here for ExtensionRef filters.
    gateway.wsh.no/traefik: "true"
    app.kubernetes.io/part-of: ddnsadmin-production
    # Selected by the clone-ddnsadmin-ghcr-pull ClusterPolicy (../kyverno-generatingpolicies.yaml),
    # which stamps the private-GHCR pull Secret into this namespace. See base/secrets-bootstrap.md.
    ddnsadmin.wsh.no/ghcr-pull: "true"
