# Production ddnsadmin instance. The workload (Deployment, Service, Ingress) comes from the signed
# manifest artifact in ddnsadmin-manifests.yaml, which also holds the release tag and this
# instance's values (host, superuser email). See ../base/secrets-bootstrap.md for the prerequisite
# Secrets (`ddnsadmin-secrets` and `ghcr-pull`) — both must exist in `ddnsadmin-production` before
# the Deployment can start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ddnsadmin-production
components:
- ../../../../../bases/netpol-baseline
resources:
- ../base
- namespace.yaml
- ddnsadmin-manifests.yaml
