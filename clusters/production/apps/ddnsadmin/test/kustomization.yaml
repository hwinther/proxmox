# Long-lived test instance for ddnsadmin. Same server render as `../production/`, just at a
# separate hostname + its own Django DB. Shares the external BIND server with production; keep
# Zone/TsigKey rows in this instance's DB independent (different zones, or experimental settings).
#
# Not referenced by any CI workflow — pure manual smoke-test target. Bump the tag in
# ddnsadmin-manifests.yaml to test a release before promoting it to production.
#
# Prerequisite Secrets (see ../base/secrets-bootstrap.md): `ddnsadmin-secrets` + `ghcr-pull`
# in the `ddnsadmin-test` namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ddnsadmin-test
components:
- ../../../../../bases/netpol-baseline
resources:
- ../base
- namespace.yaml
- ddnsadmin-manifests.yaml
