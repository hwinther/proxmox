apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redisinsight
  namespace: shared-test
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Data"
    gethomepage.dev/name: "RedisInsight (test Valkey)"
    gethomepage.dev/siteMonitor: "https://redis-test.mgmt.wsh.no"
    gethomepage.dev/icon: "redis"
    gethomepage.dev/description: "shared-test Valkey (Redis protocol) \u2014 preconnected to redis.shared-test.svc.cluster.local"
    gethomepage.dev/weight: "10"
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: web
  hostnames:
  - redis-test.mgmt.wsh.no
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: authelia-forwardauth
    backendRefs:
    - name: redisinsight
      port: 5540
