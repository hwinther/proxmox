# Headlamp Helm chart / plugin init images may use tags that tripped policy checks; scoped to this namespace.
# Active: Kyverno 1.19 applies policies.kyverno.io PolicyExceptions to the CEL ValidatingPolicy below
# even with --enablePolicyException=false (that flag only governs the legacy kyverno.io kind); the
# PolicyReports show "rule is skipped due to policy exception".
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: headlamp-plugin-flux-image
  namespace: headlamp-production
spec:
  policyRefs:
  - name: wsh-disallow-latest-require-digest
    kind: ValidatingPolicy
  matchConditions:
  - name: scope
    expression: >-
      object.metadata.namespace == 'headlamp-production'
