# Bump metadata.name when changing template or migrator image (Job spec is immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: clutterstock-migrate-v115
  namespace: clutterstock-production
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: Flux (prune + force) recreates a TTL-deleted Job on its next
  # reconcile, which turned this one-time migration into a nightly re-run (2026-09-22..10-01,
  # one of which collided with a CNPG operator restart). The completed Job stays put; bumping
  # metadata.name for a new migrator lets Flux prune the old one.
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clutterstock-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: migrator
        image: ghcr.io/hwinther/clutterstock/migrator:0.28.0
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        # Connects as CNPG-managed `clutterstock` role via cloned clutterstock-pg-secret.
        - name: PG_HOST
          value: postgres-prod-rw.postgres-production.svc.cluster.local
        - name: PG_DB
          value: clutterstock
        - name: PG_USER
          value: clutterstock
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clutterstock-pg-secret
              key: password
        - name: ConnectionStrings__ClutterStock
          value: "Host=$(PG_HOST);Port=5432;Database=$(PG_DB);Username=$(PG_USER);Password=$(PG_PASSWORD)"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
